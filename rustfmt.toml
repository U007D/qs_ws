# Formatting settings from the reference workspace supported by stable rustfmt.
array_width = 100
attr_fn_like_width = 100
chain_width = 100
edition = "2024"
fn_call_width = 100
match_block_trailing_comma = true
max_width = 100
newline_style = "Unix"
reorder_modules = true
use_field_init_shorthand = true
use_try_shorthand = true
